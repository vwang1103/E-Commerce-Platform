name: ecommerce-local

x-mysql-common: &mysql-common
  image: ${MYSQL_IMAGE:-mysql:8.4.11}
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    MYSQL_USER: ${MYSQL_APP_USER:-ecommerce}
    MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s
  networks:
    - ecommerce-private

x-flyway-common: &flyway-common
  image: ${FLYWAY_IMAGE:-flyway/flyway:13.6.0-alpine}
  restart: "no"
  networks:
    - ecommerce-private

x-backend-service: &backend-service
  image: ecommerce-backend:local
  build:
    context: ../..
    dockerfile: deploy/local/backend.Dockerfile
    args:
      MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21-alpine}
      JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.8_9-jre-alpine}
      MAVEN_TEST_ARGS: ${MAVEN_TEST_ARGS:-}
  restart: unless-stopped
  environment: &backend-environment
    CONSUL_ENABLED: "true"
    CONSUL_HOST: consul
    CONSUL_PORT: 8500
  networks:
    - ecommerce-private

services:
  mysql-core:
    <<: *mysql-common
    container_name: ecommerce-mysql-core
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: platform_admin
      MYSQL_USER: ${MYSQL_APP_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    ports:
      - "127.0.0.1:${MYSQL_CORE_PORT:-13306}:3306"
    volumes:
      - mysql-core-data:/var/lib/mysql

  mysql-order-0:
    <<: *mysql-common
    container_name: ecommerce-mysql-order-0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: order_db
      MYSQL_USER: ${MYSQL_APP_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    ports:
      - "127.0.0.1:${MYSQL_ORDER_0_PORT:-13307}:3306"
    volumes:
      - mysql-order-0-data:/var/lib/mysql

  mysql-order-1:
    <<: *mysql-common
    container_name: ecommerce-mysql-order-1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: order_db
      MYSQL_USER: ${MYSQL_APP_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    ports:
      - "127.0.0.1:${MYSQL_ORDER_1_PORT:-13308}:3306"
    volumes:
      - mysql-order-1-data:/var/lib/mysql

  redis:
    image: ${REDIS_IMAGE:-redis:8.2.10}
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ecommerce-private

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    container_name: ecommerce-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - ecommerce-private

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.4.5}
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ecommerce-private

  consul:
    image: ${CONSUL_IMAGE:-hashicorp/consul:1.22.7}
    container_name: ecommerce-consul
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "127.0.0.1:${CONSUL_HTTP_PORT:-8500}:8500"
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-private

  core-migrate:
    <<: *flyway-common
    container_name: ecommerce-core-migrate
    depends_on:
      mysql-core:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql-core:3306/platform_admin?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=${MYSQL_ROOT_PASSWORD:-local-root-password}
      - -connectRetries=60
      - -placeholders.appUser=${MYSQL_APP_USER:-ecommerce}
      - -placeholders.appPassword=${MYSQL_APP_PASSWORD:-local-app-password}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./migrations/core:/flyway/sql:ro

  catalog-migrate:
    <<: *flyway-common
    container_name: ecommerce-catalog-migrate
    depends_on:
      core-migrate:
        condition: service_completed_successfully
    command:
      - -url=jdbc:mysql://mysql-core:3306/catalog_db?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_APP_USER:-ecommerce}
      - -password=${MYSQL_APP_PASSWORD:-local-app-password}
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/seed
      - migrate
    volumes:
      - ../../backend/catalog-service/src/main/resources/db/migration:/flyway/sql:ro
      - ../../backend/catalog-service/src/main/resources/db/seed:/flyway/seed:ro

  inventory-migrate:
    <<: *flyway-common
    container_name: ecommerce-inventory-migrate
    depends_on:
      core-migrate:
        condition: service_completed_successfully
    command:
      - -url=jdbc:mysql://mysql-core:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_APP_USER:-ecommerce}
      - -password=${MYSQL_APP_PASSWORD:-local-app-password}
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/seed
      - migrate
    volumes:
      - ../../backend/inventory-service/src/main/resources/db/migration:/flyway/sql:ro
      - ../../backend/inventory-service/src/main/resources/db/seed:/flyway/seed:ro

  order-0-migrate:
    <<: *flyway-common
    container_name: ecommerce-order-0-migrate
    depends_on:
      mysql-order-0:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql-order-0:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_APP_USER:-ecommerce}
      - -password=${MYSQL_APP_PASSWORD:-local-app-password}
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ../../backend/order-service/src/main/resources/db/migration:/flyway/sql:ro

  order-1-migrate:
    <<: *flyway-common
    container_name: ecommerce-order-1-migrate
    depends_on:
      mysql-order-1:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql-order-1:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_APP_USER:-ecommerce}
      - -password=${MYSQL_APP_PASSWORD:-local-app-password}
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ../../backend/order-service/src/main/resources/db/migration:/flyway/sql:ro

  catalog-service:
    <<: *backend-service
    container_name: ecommerce-catalog-service
    command: ["/app/catalog-service.jar"]
    environment:
      <<: *backend-environment
      INSTANCE_ID: catalog-compose-1
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      CATALOG_DB_URL: jdbc:mysql://mysql-core:3306/catalog_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      CATALOG_DB_USER: ${MYSQL_APP_USER:-ecommerce}
      CATALOG_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CATALOG_EVENTS_ENABLED: "true"
      CATALOG_SEARCH_ENABLED: "true"
      CATALOG_DLT_REPLAY_ENABLED: "true"
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8081}:8081"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  inventory-service:
    <<: *backend-service
    container_name: ecommerce-inventory-service
    command: ["/app/inventory-service.jar"]
    environment:
      <<: *backend-environment
      INSTANCE_ID: inventory-compose-1
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      INVENTORY_DB_URL: jdbc:mysql://mysql-core:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      INVENTORY_DB_USER: ${MYSQL_APP_USER:-ecommerce}
      INVENTORY_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8082}:8082"
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  order-service:
    <<: *backend-service
    container_name: ecommerce-order-service
    command: ["/app/order-service.jar"]
    environment:
      <<: *backend-environment
      INSTANCE_ID: order-compose-1
      ORDER_DB_SHARD_0_URL: jdbc:mysql://mysql-order-0:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      ORDER_DB_SHARD_1_URL: jdbc:mysql://mysql-order-1:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      ORDER_DB_USER: ${MYSQL_APP_USER:-ecommerce}
      ORDER_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_EVENTS_ENABLED: "true"
      ORDER_DLT_REPLAY_ENABLED: "true"
    ports:
      - "127.0.0.1:${ORDER_PORT:-8083}:8083"
    depends_on:
      order-0-migrate:
        condition: service_completed_successfully
      order-1-migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s

  gateway-service:
    <<: *backend-service
    container_name: ecommerce-gateway-service
    command: ["/app/gateway-service.jar"]
    environment:
      <<: *backend-environment
      INSTANCE_ID: gateway-compose-1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000,http://localhost:${SWAGGER_UI_PORT:-8085}"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  swagger-ui:
    image: ${SWAGGER_UI_IMAGE:-swaggerapi/swagger-ui:v5.33.1}
    container_name: ecommerce-swagger-ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    ports:
      - "127.0.0.1:${SWAGGER_UI_PORT:-8085}:8080"
    volumes:
      - ../../docs/api/openapi.yaml:/openapi/openapi.yaml:ro
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ecommerce-private

  storefront:
    image: ecommerce-storefront:local
    container_name: ecommerce-storefront
    build:
      context: ../..
      dockerfile: deploy/local/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.11.0-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29.2-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-8084}:8080"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep -q '<title>Arcade</title>'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ecommerce-private

networks:
  ecommerce-private:
    name: ecommerce-private
    driver: bridge

volumes:
  mysql-core-data:
  mysql-order-0-data:
  mysql-order-1-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  consul-data:
